[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neoreef"
version = "0.1.0"
description = "Coral reef photogrammetry to CesiumJS: Metashape batch, Cesium post-processing pipeline, and viewers"
readme = "README.md"
license = { file = "LICENSE" }
# Lower bound is dictated by the Python bundled with Metashape Pro (3.9.x).
# neoreef.common and neoreef.metashape must stay importable there.
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
# Geospatial libs (rasterio, geopandas, fiona) come from conda-forge, not pip.
pipeline = ["requests>=2.28", "boto3>=1.26"]
dev = ["pytest>=7"]

[project.scripts]
neoreef-pipeline = "neoreef.pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "geo: needs rasterio/geopandas (conda env); skipped elsewhere",
]
